services:
  # ───────────────────────────────────────────
  # Backend – FastAPI + AI Models
  # ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cnn_meow_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/weights:/app/weights      # model weights (YOLO + EfficientNet)
      - ./backend/uploads:/app/uploads      # uploaded images
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ───────────────────────────────────────────
  # Frontend – Streamlit UI
  # ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cnn_meow_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app                     # live-reload: sync code changes
    environment:
      - BACKEND_URL=http://backend:8000     # internal Docker network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped